name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-release
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select version
        id: version
        run: |
          $tags = @(git tag --list 'v*')
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing version tags.' }
          $versions = @(
            foreach ($tag in $tags) {
              if ($tag -match '^v\d+\.\d+\.\d+(\.\d+)?$') {
                $parsed = [version]$tag.Substring(1)
                if ($parsed.Major -gt 65534 -or $parsed.Minor -gt 65534 -or $parsed.Build -gt 65534 -or $parsed.Revision -gt 65534) {
                  throw "Tag $tag exceeds the Windows assembly version limits."
                }
                $parsed
              }
            }
          )
          $version = '1.0.0'
          if ($versions.Count -gt 0) {
            $latest = $versions | Sort-Object -Descending | Select-Object -First 1
            if ($latest.Build -ge 65534) {
              throw 'Patch version reached the Windows assembly limit. Create a higher major/minor version tag before retrying.'
            }
            $version = '{0}.{1}.{2}' -f $latest.Major, $latest.Minor, ($latest.Build + 1)
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building release v$version"

      - name: Publish self-contained Windows app
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet publish src\FolderSize.App\FolderSize.App.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -o artifacts\FolderSize-installer-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed.' }

      - name: Prepare Inno Setup compiler
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') {
            throw 'Inno Setup download has an invalid or unexpected signature.'
          }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/PORTABLE=1', '/TASKS=""', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Compiler setup failed: $($process.ExitCode)" }
          "INNO_COMPILER=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Compile installer
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          & $env:INNO_COMPILER "/DAppVersion=$env:APP_VERSION" installer\FolderSize.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }

      - name: Verify installation and removal
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          .\installer\Test-Installer.ps1 -InstallerPath "artifacts\FolderSize-$env:APP_VERSION-win-x64-Setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FolderSize-win-x64-installer
          path: artifacts\FolderSize-*-win-x64-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installer = "artifacts\FolderSize-$env:APP_VERSION-win-x64-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer asset is missing: $installer"
          }
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:GITHUB_SHA" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag. No existing tag was overwritten.' }
          gh release create "$env:RELEASE_TAG" "$installer" --verify-tag --title "FolderSize $env:APP_VERSION" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation or installer upload failed.' }
